<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Jacopo Doris — Checkout TEST</title><style>body{margin:0;background:#eeede8;color:#191a1a;font:18px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif}main{max-width:740px;margin:12vh auto;padding:30px}h1{font-size:clamp(42px,8vw,88px);letter-spacing:-.06em;line-height:1.1;font-weight:300}a{color:inherit;border-bottom:1px solid;padding-bottom:5px}small{letter-spacing:.12em;text-transform:uppercase}</style></head><body><main><small>JD / EDITIONS · STRIPE TEST</small><h1 id="heading">Checkout di prova.</h1><p id="detail">Questa è una simulazione: non è stato incassato denaro reale. Nessun ordine viene evaso e il magazzino non viene aggiornato.</p><p><a href="index.html#editions">Torna a Editions</a></p></main><script>const p=new URLSearchParams(location.search);if(p.get('checkout')==='cancel'){document.getElementById('heading').textContent='Pagamento annullato.';document.getElementById('detail').textContent='Non è stato effettuato alcun addebito. Il carrello rimane salvato nel browser.';}else if(p.get('checkout')==='success'){document.getElementById('heading').textContent='Test completato.';document.getElementById('detail').textContent='Se Stripe ha confermato il pagamento di prova, nessun denaro reale è stato addebitato. Questo ritorno al sito non certifica un ordine: la conferma affidabile richiede un webhook Stripe verificato.';}</script></body></html>
