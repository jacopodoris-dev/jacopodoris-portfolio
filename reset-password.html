<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>JD Studio — Nuova password</title><link rel="stylesheet" href="studio.css"><style>.reset-wrap{max-width:760px;margin:7vh auto;padding:22px}.reset-wrap h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:400;letter-spacing:-.055em;line-height:1.1}.reset-wrap label{display:block;margin:18px 0}.reset-wrap input{width:100%;max-width:100%}.reset-wrap p{line-height:1.65}</style></head>
<body><header><a href="studio.html">← JD STUDIO</a><strong>JACOPO DORIS <span>V8.8.1</span></strong></header><main class="reset-wrap"><section class="panel"><p class="eyebrow">ACCESSO EDITORIALE RISERVATO</p><h1>Una nuova chiave<br>per il tuo studio.</h1><p id="status" role="status">Verifica del collegamento…</p><form id="resetForm" hidden><label>Nuova password (almeno 12 caratteri)<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>Conferma password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Salva nuova password</button></form><p id="back" hidden><a href="studio.html">Torna all’accesso di JD Studio</a></p></section></main>
<script src="site-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async()=>{
const status=document.getElementById('status'),form=document.getElementById('resetForm'),back=document.getElementById('back');
if(!window.supabase||!window.JD_SUPABASE_URL||!window.JD_SUPABASE_ANON_KEY){status.textContent='Configurazione Supabase non disponibile.';return}
const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const attemptedRecovery=hash.get('type')==='recovery'||params.has('code')||hash.has('access_token');
const err=params.get('error_description')||hash.get('error_description');
if(err){status.textContent='Collegamento non valido o scaduto. Richiedine uno nuovo da JD Studio.';back.hidden=false;return}
const db=window.supabase.createClient(window.JD_SUPABASE_URL,window.JD_SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:true}});
let enabled=false;
function ready(){if(!attemptedRecovery||enabled)return;enabled=true;form.hidden=false;back.hidden=true;status.textContent='Collegamento verificato. Imposta una nuova password.'}
db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')ready()});
const {data,error}=await db.auth.getSession();
if(error){status.textContent='Collegamento scaduto o non valido. Richiedine uno nuovo da JD Studio.';back.hidden=false;return}
if(data.session&&attemptedRecovery)ready();
if(!enabled){status.textContent='Apri questa pagina tramite il collegamento di recupero ricevuto per email.';back.hidden=false}
form.addEventListener('submit',async e=>{e.preventDefault();if(!enabled)return;const pw=document.getElementById('newPassword').value,conf=document.getElementById('confirmPassword').value;if(pw.length<12){status.textContent='Usa almeno 12 caratteri.';return}if(pw!==conf){status.textContent='Le password non coincidono.';return}const btn=form.querySelector('button');btn.disabled=true;status.textContent='Aggiornamento password in corso…';const {error}=await db.auth.updateUser({password:pw});if(error){status.textContent='Errore: '+error.message;btn.disabled=false;return}form.hidden=true;status.textContent='Password aggiornata. Ora puoi accedere a JD Studio.';back.hidden=false;await db.auth.signOut()});
})().catch(e=>{document.getElementById('status').textContent='Errore: '+e.message});
</script></body></html>
